services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mundial
      POSTGRES_PASSWORD: mundial
      POSTGRES_DB: mundial
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mundial"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mundial:mundial@db:5432/mundial
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
